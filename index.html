<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Paluan — Em breve</title>

  <meta
    name="description"
    content="Paluan. Menos atrito. Mais resultado."
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #eaeaea;

      background:
        url("./paluan_apple_3840x2160.png")
        center center / cover
        no-repeat;

      overflow: hidden;
    }

    .page {
      min-height: 100dvh;

      display: flex;
      flex-direction: column;

      padding:
        max(24px, env(safe-area-inset-top))
        24px
        max(24px, env(safe-area-inset-bottom));
    }

    main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    h1 {
      font-size: clamp(1rem, 4vw, 1.35rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.4;
    }

    footer {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 20px;

      font-size: 0.8rem;
    }

    footer a {
      color: rgba(234, 234, 234, 0.7);
      text-decoration: none;

      transition: color 0.2s ease;
    }

    footer a:hover,
    footer a:focus-visible {
      color: #eaeaea;
    }

    @media (min-width: 768px) {
      .page {
        padding: 40px;
      }

      footer {
        gap: 28px;
        font-size: 0.875rem;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <main>
      <h1>Em breve. Menos atrito, mais resultado.</h1>
    </main>

    <footer>
      <a
        href="https://instagram.com/frompaluan"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

      <a
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
      </a>

      <a
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </a>
    </footer>

  </div>
</body>
</html>
