<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Paluan — Em breve</title>

  <meta name="description" content="Paluan. Menos atrito. Mais resultado." />
  <meta name="theme-color" content="#0d0a12" />
  <meta name="color-scheme" content="dark" />

  <!-- Open Graph / redes sociais -->
  <meta property="og:title" content="Paluan — Em breve" />
  <meta property="og:description" content="Menos atrito. Mais resultado." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./paluan_apple_3840x2160.png" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    :root {
      --bg: #0d0a12;
      --fg: #eaeaea;
      --accent: #8b5cf6;
      --fg-muted: rgba(234, 234, 234, 0.7);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    /* Mobile first: imagem cobre a tela toda, ancorada no centro
       (é onde o "P" está), sem repetir e sem gerar scroll. */
    body {
      min-height: 100dvh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-weight: 400;

      color: var(--fg);
      background-color: var(--bg);
      background-image: url("./paluan_apple_3840x2160.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;

      overflow: hidden;
    }

    .page {
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      gap: 40px;

      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));

      animation: fade-in 0.9s ease both;
    }

    main {
      display: flex;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.5;
      max-width: 26ch;
    }

    footer {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 20px;

      font-size: 0.75rem;
    }

    footer a {
      color: var(--fg-muted);
      text-decoration: none;

      transition: color 0.2s ease;
    }

    footer a:hover,
    footer a:focus-visible {
      color: var(--fg);
    }

    footer a:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 4px;
      border-radius: 2px;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page {
        animation: none;
      }
    }

    /* Tablet e acima: layout original, texto centralizado na tela toda */
    @media (min-width: 768px) {
      .page {
        justify-content: center;
        gap: 0;
        padding: 40px;
      }

      main {
        flex: 1;
        align-items: center;
      }

      h1 {
        font-size: clamp(1rem, 2.2vw, 1.35rem);
        max-width: 32ch;
      }

      footer {
        gap: 28px;
        font-size: 0.875rem;
      }
    }

    /* iOS Safari não suporta bem background-attachment: fixed */
    @supports (-webkit-touch-callout: none) {
      body {
        background-attachment: scroll;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <main>
      <h1>Em breve. Menos atrito, mais resultado.</h1>
    </main>

    <footer>
      <a
        href="https://www.instagram.com/frompaluan/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

      <a
        href="https://github.com/frompaluan"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </a>
    </footer>

  </div>
</body>
</html>
